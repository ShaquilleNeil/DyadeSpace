name: dyadespace
description: DyadeSpace - lean crew task app for Dyade Management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Web URL strategy (public /privacy route): the app must read
  # the browser's pathname as its route. Flutter web defaults
  # to hash routing, which ignores the path — see
  # lib/utils/url_strategy_web.dart.
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  # FlutterFire BoM 5.1.0 set - bumped 2026-11-11 for the
  # mandatory Firestore security patch (compromised eMudhra CA):
  # cloud_firestore 7.1.0 is the first fully patched release.
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  firebase_messaging: ^17.0.1
  # Audit fixes (Nov 14, 2026): Crashlytics + App Check.
  # Crashlytics 6.0.1 and App Check 0.5.1 both require
  # firebase_core ^5.1.0 (verified on pub.dev) and Flutter
  # >= 3.27 — the project runs Flutter 3.47 / Dart 3.13.
  firebase_crashlytics: ^6.0.1
  firebase_app_check: ^0.5.1
  # Audit fixes: app version from pubspec (package_info_plus),
  # runtime mic permission (permission_handler), image
  # compression before upload (flutter_image_compress).
  package_info_plus: ^10.2.2
  # 13.x requires Android SDK 37, which the owner's Mac does
  # not have (Gradle fails on it) — stay on 11.x. The code only
  # uses Permission.microphone.request() and openAppSettings(),
  # both present in 11.x.
  permission_handler: ^11.3.1
  flutter_image_compress: ^2.5.1
  # Audit fixes: call the disableUser Cloud Function from Team.
  # cloud_functions 7.0.1 requires firebase_core ^5.1.0
  # (verified on pub.dev).
  cloud_functions: ^7.0.1
  image_picker: ^1.1.2
  intl: ^0.20.3
  # Opens Google Maps directions from a delivery stop address.
  url_launcher: ^6.3.1
  # System share sheet for the client progress update (Reports).
  # 13.x (needs Flutter >= 3.38.1, Dart >= 3.10.0 — the project
  # runs Flutter 3.47 / Dart 3.13): file_picker 13.3.3 needs
  # win32 ^6.3.0, which only share_plus 13.x provides (12.x pins
  # win32 ^5.5.3 and pub get fails). Code already uses the 13.x
  # SharePlus.instance.share(ShareParams(...)) API, so no Dart
  # changes were needed for the bump.
  share_plus: ^13.3.1
  # Offline photo queue (photo_queue_service): the queue itself
  # lives in shared_preferences, connectivity changes re-trigger
  # processing, and picked photos are parked under the app
  # documents dir (path_provider) so a cache purge cannot eat
  # them. Floors chosen for Dart >= 3.4 / Flutter >= 3.22:
  # shared_preferences 2.3.2 and connectivity_plus 6.0.5 are the
  # last lines that still resolve there (later releases raise
  # the minimums); path_provider ^2.1.2 lets pub pick the newest
  # 2.1.x the toolchain allows.
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  path_provider: ^2.1.2
  # Clock-in by site: one GPS fix at the tap, never tracked
  # through the day. Latest 14.x resolves on the project's
  # Flutter 3.47 / Dart 3.13 toolchain.
  geolocator: ^14.1.2
  # Bulk invite: pick a .csv file of emails to import.
  file_picker: ^13.3.3
  # Chat media: voice notes (record), voice-note playback
  # (audioplayers), video messages (video_player), and saving
  # photos to the device gallery (gal). All latest lines
  # resolve on Flutter 3.47 / Dart 3.13 (verified on pub.dev
  # 2026-11-13): record 7.2.0, audioplayers 6.8.1,
  # video_player 2.14.1, gal 3.0.0.
  record: ^7.2.0
  audioplayers: ^6.8.1
  video_player: ^2.14.1
  gal: ^3.0.0
  google_fonts: ^6.2.1
  # Clock-in/out map view: OpenStreetMap tiles, no API key,
  # no native setup. Latest 8.x resolves on Flutter 3.47 /
  # Dart 3.13 (verified on pub.dev 2026-11-14: 8.3.2 needs
  # Dart >= 3.6, Flutter >= 3.27). latlong2 is listed
  # directly because the map screen uses LatLng itself.
  flutter_map: ^8.3.2
  latlong2: ^0.9.0
  workmanager: ^0.10.10
  flutter_foreground_task: ^11.0.3

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  # Generates the launcher icons from assets/icon/app_icon.png
  # (adaptive foreground: app_icon_foreground.png) — run
  # `dart run flutter_launcher_icons` on the Mac after pub get.
  flutter_launcher_icons: ^0.14.3
  fake_cloud_firestore: ^4.5.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0A0E14"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
